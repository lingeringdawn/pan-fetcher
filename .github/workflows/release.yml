name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Create the GitHub Release first, then let the build jobs attach assets.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      # Build the release notes from CHANGELOG.md rather than from the annotated
      # tag.
      #
      # --notes-from-tag used to be used here, but it reads the tag object, and a
      # tag that is created before the final commit lands (or re-pointed) ends up
      # describing the wrong commit: releases were published with a body of
      # "docs: CHANGELOG 记录 vX.Y.Z" instead of the actual notes. CHANGELOG.md is
      # the source of truth for what changed, so the section for this tag is
      # extracted from it.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Take everything under "## vX.Y.Z" up to the next "## " heading.
          awk -v ver="$version" '
            $0 ~ "^## v?" ver "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG section for $version; falling back to the tag message"
            printf 'Release %s\n' "$GITHUB_REF_NAME" > /tmp/notes.md
          fi

          echo "--- notes ---"
          cat /tmp/notes.md

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No --cleanup-tag: the tag is what triggered this run, and deleting it
          # would leave the repository without the tag the release is named after.
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            --title "${{ github.ref_name }}" \
            --prerelease=${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  build:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, cc: gcc }
          - { goarch: arm64, cc: aarch64-linux-gnu-gcc }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install cross-compilers
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION=${{ github.ref_name }}
          go build -ldflags="-s -w -X github.com/lingeringdawn/pan-fetcher/server.Version=${VERSION}" -o pan-fetcher .

      - name: Package (tar.gz)
        run: tar -czf pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz pan-fetcher

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.*

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pan-fetcher:latest
            ${{ secrets.DOCKER_USERNAME }}/pan-fetcher:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pan-fetcher:latest
            ghcr.io/${{ github.repository_owner }}/pan-fetcher:${{ github.ref_name }}
