name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Create the GitHub Release first with annotated tag message as body.
  # Build jobs then only upload assets without overwriting the body.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --notes-from-tag \
            --title "${{ github.ref_name }}" \
            --prerelease=${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  build:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, cc: gcc }
          - { goarch: arm64, cc: aarch64-linux-gnu-gcc }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install cross-compilers
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION=${{ github.ref_name }}
          go build -ldflags="-s -w -X github.com/lingeringdawn/pan-fetcher/server.Version=${VERSION}" -o pan-fetcher .

      - name: Package (tar.gz)
        run: tar -czf pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz pan-fetcher

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.*

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pan-fetcher:latest
            ${{ secrets.DOCKER_USERNAME }}/pan-fetcher:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pan-fetcher:latest
            ghcr.io/${{ github.repository_owner }}/pan-fetcher:${{ github.ref_name }}
