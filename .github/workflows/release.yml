name: Release

# Every tag publishes a prerelease first.
#
# A release is visible to users the moment it is published: the panel's update
# check reads /releases/latest, Docker users pull :latest, and both would hand
# out a build nobody has run yet. Publishing as a prerelease keeps it out of all
# of those paths while the binaries are downloadable for testing.
#
# Promote a verified version with:
#   gh release edit vX.Y.Z --prerelease=false --latest
# The docker job below re-tags :latest only when the release is not a
# prerelease, so promoting means re-running that job (workflow_dispatch) — see
# the note on the docker job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Tag to promote to a stable release (e.g. v2.0.30)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # Promote an existing prerelease to a stable one. Runs instead of a build when
  # the workflow is dispatched with a tag.
  promote:
    name: Promote to stable
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # gh release view resolves the repository from the working directory, so a
      # checkout is required even though nothing is built here. Without it the
      # step fails with "fatal: not a git repository".
      - uses: actions/checkout@v4

      - name: Promote release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.promote }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag given"
            exit 1
          fi
          # Refuse to promote something that has no assets: an empty release is
          # almost always a failed build, and marking it stable would point
          # /releases/latest at nothing.
          assets=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "$TAG has $assets asset(s)"
          if [ "$assets" -lt 2 ]; then
            echo "::error::$TAG has fewer than 2 assets; refusing to promote"
            exit 1
          fi
          gh release edit "$TAG" --prerelease=false --latest
          echo "promoted $TAG to a stable release"

      # :latest is what an unattended `docker pull` gets, so it only moves once
      # the release is stable. Moving a tag means re-pushing the same image under
      # the new name, which the registry accepts as a manifest copy.
      - name: Move :latest to the promoted tag
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          docker pull "$DOCKER_USERNAME/pan-fetcher:$TAG"
          docker tag  "$DOCKER_USERNAME/pan-fetcher:$TAG" "$DOCKER_USERNAME/pan-fetcher:latest"
          docker push "$DOCKER_USERNAME/pan-fetcher:latest"

          docker pull "ghcr.io/$GHCR_OWNER/pan-fetcher:$TAG"
          docker tag  "ghcr.io/$GHCR_OWNER/pan-fetcher:$TAG" "ghcr.io/$GHCR_OWNER/pan-fetcher:latest"
          docker push "ghcr.io/$GHCR_OWNER/pan-fetcher:latest"

          echo "moved :latest to $TAG"

  # Create the GitHub Release first, then let the build jobs attach assets.
  create-release:
    name: Create Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      # Build the release notes from CHANGELOG.md rather than from the annotated
      # tag.
      #
      # --notes-from-tag used to be used here, but it reads the tag object, and a
      # tag that is created before the final commit lands (or re-pointed) ends up
      # describing the wrong commit: releases were published with a body of
      # "docs: CHANGELOG 记录 vX.Y.Z" instead of the actual notes. CHANGELOG.md is
      # the source of truth for what changed, so the section for this tag is
      # extracted from it.
      - name: Extract release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Take everything under "## vX.Y.Z" up to the next "## " heading.
          awk -v ver="$version" '
            $0 ~ "^## v?" ver "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG section for $version; falling back to the tag message"
            printf 'Release %s\n' "$GITHUB_REF_NAME" > /tmp/notes.md
          fi

          # Say plainly that this is a prerelease, so someone who lands on the
          # page does not assume it is the version to install.
          {
            printf '> **预览版** —— 尚未验证。测试无误后转为正式版。\n\n'
            cat /tmp/notes.md
          } > /tmp/notes-final.md

          echo "--- notes ---"
          cat /tmp/notes-final.md

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No --cleanup-tag: the tag is what triggered this run, and deleting it
          # would leave the repository without the tag the release is named after.
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          # Always a prerelease. Promotion is a separate, deliberate step.
          gh release create "${{ github.ref_name }}" \
            --notes-file /tmp/notes-final.md \
            --title "${{ github.ref_name }} (预览版)" \
            --prerelease

  build:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: create-release
    # Only on a tag push. A dispatched run is a promotion, and the assets already
    # exist — rebuilding would produce a second set for the same release.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, cc: gcc }
          - { goarch: arm64, cc: aarch64-linux-gnu-gcc }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install cross-compilers
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION=${{ github.ref_name }}
          go build -ldflags="-s -w -X github.com/lingeringdawn/pan-fetcher/server.Version=${VERSION}" -o pan-fetcher .

      - name: Package (tar.gz)
        run: tar -czf pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz pan-fetcher

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: pan-fetcher-${{ github.ref_name }}-linux-${{ matrix.goarch }}.*

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    # Only on a tag push: the version tag is what this builds. :latest is moved
    # separately by the promote job, once the release is stable.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag is always pushed, so a prerelease can be pulled by its
      # exact tag for testing. :latest is only moved on a promotion, because it is
      # what an unattended `docker pull` gets.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pan-fetcher:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pan-fetcher:${{ github.ref_name }}
